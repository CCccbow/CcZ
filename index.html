<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简易计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #fff3e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 340px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(255,150,0,0.2);
        }
        h1 {
            color: #ff6600;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            height: 44px;
            margin: 6px 0;
            padding: 10px;
            border: 2px solid #ffcc80;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 60px;
            height: 50px;
            margin: 6px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }
        button:hover {
            background: #f57c00;
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            color: #e65100;
            font-weight: bold;
        }
        .login {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>计算器</h1>

    <div class="login">
        <input type="text" id="user" placeholder="用户名 test1"><br>
        <input type="password" id="pwd" placeholder="密码 123456"><br>
        <button onclick="login()">登录</button>
    </div>

    <input type="number" id="n1" placeholder="数字1"><br>
    <input type="number" id="n2" placeholder="数字2"><br>

    <button onclick="go('+')">+</button>
    <button onclick="go('-')">-</button>
    <button onclick="go('*')">×</button>
    <button onclick="go('/')">÷</button>

    <div id="result"></div>
</div>

<script>
    // 后端地址（和你现在完全一致）
    const URL = "http://localhost:8092/api";
    let token = null;
    let isVip = false;

    // 登录
    async function login() {
        let username = document.getElementById("user").value;
        let password = document.getElementById("pwd").value;

        let res = await fetch(URL + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        let data = await res.json();
        alert(data.msg);

        if (data.success) {
            token = data.token;
            isVip = data.isVip;
        }
    }

    // 计算
    async function go(op) {
        let a = parseFloat(document.getElementById("n1").value);
        let b = parseFloat(document.getElementById("n2").value);
        let r = document.getElementById("result");

        if (isNaN(a) || isNaN(b)) {
            r.innerText = "请输入数字";
            return;
        }

        // 权限
        if (op === "*" && !token) {
            r.innerText = "请先登录";
            return;
        }
        if (op === "/" && !token) {
            r.innerText = "请先登录";
            return;
        }
        if (op === "/" && !isVip) {
            r.innerText = "需要VIP";
            return;
        }

        try {
            let api = URL + "/calc";
            let head = { "Content-Type": "application/json" };

            if (op === "*") {
                api = URL + "/calc/mul";
                head.Authorization = "Bearer " + token;
            }
            if (op === "/") {
                api = URL + "/calc/div";
                head.Authorization = "Bearer " + token;
            }

            let res = await fetch(api, {
                method: "POST",
                headers: head,
                body: JSON.stringify({ num1: a, num2: b, operator: op })
            });

            let data = await res.json();
            r.innerText = data.success ? "结果：" + data.result : data.msg;
        } catch (e) {
            r.innerText = "网络错误";
        }
    }
</script>

</body>
</html>
